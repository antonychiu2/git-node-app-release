apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: git-node-app-release

# Release orchestration for the git-node-app application.
# Started from the Application's Releases tab: CloudBees Unify passes a
# `manifest` listing the artifact version of each component to release.
# Staging deploys straight away; production waits for the manual approval
# configured on the "prod" environment in Unify, then deploys the same image.

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (generated by CloudBees Unify)

metadata:
  stages/v1alpha1:
    - name: Staging
      jobs:
        - deploy-staging
    - name: Production
      jobs:
        - deploy-production

jobs:
  deploy-staging:
    environment: staging
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: staging
      namespace: staging
      values-file: values-staging.yaml

  deploy-production:
    needs:
      - deploy-staging
    environment: prod
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: prod
      namespace: production
      values-file: values-prod.yaml
