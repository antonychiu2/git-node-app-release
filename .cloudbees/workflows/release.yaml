apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: git-node-app-release

# Release orchestration for the git-node-app application (GitOps with Argo CD).
# Started from the Application's Releases tab: CloudBees Unify passes a
# `manifest` listing the artifact version of each component to release.
# Each stage commits the image tag to that environment's values file and waits
# for Argo CD to sync it and report Healthy (polled via the Argo CD API at
# vars.ARGOCD_URL, an ngrok tunnel; see deployer.yaml). Production waits for the manual
# approval configured on the "prod" environment in Unify, then promotes the
# same image.

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (generated by CloudBees Unify)
      ticket:
        type: string
        required: false
        default: ""
        description: Jira ticket ID to prefix the GitOps commits with (e.g. GS-5)

metadata:
  stages/v1alpha1:
    - name: Staging
      jobs:
        - deploy-staging
    - name: Production
      jobs:
        - deploy-production

jobs:
  deploy-staging:
    environment: staging
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: staging
      namespace: staging
      values-file: values-staging.yaml
      argo-app: git-node-app-staging
      argo-url: ${{ vars.ARGOCD_URL }}
      app-url: ${{ vars.STAGING_APP_URL }}
      ticket: ${{ inputs.ticket }}

  deploy-production:
    needs:
      - deploy-staging
    environment: prod
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: prod
      namespace: production
      values-file: values-prod.yaml
      argo-app: git-node-app-production
      argo-url: ${{ vars.ARGOCD_URL }}
      app-url: ${{ vars.PROD_APP_URL }}
      ticket: ${{ inputs.ticket }}
