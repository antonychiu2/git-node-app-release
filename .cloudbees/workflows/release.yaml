apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: git-node-app-release
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (generated by CloudBees Unify)
      ticket:
        type: string
        required: false
        default: ""
        description: Jira ticket ID to prefix the GitOps commits with (e.g. GS-5)
metadata:
  stages/v1alpha1:
    - name: Staging
      jobs:
        - deploy-staging
    - name: Production
      jobs:
        - deploy-production
        - manual-approval
jobs:
  deploy-staging:
    environment: staging
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: staging
      namespace: staging
      values-file: values-staging.yaml
      argo-app: git-node-app-staging
      argo-url: ${{ vars.ARGOCD_URL }}
      app-url: ${{ vars.STAGING_APP_URL }}
      ticket: ${{ inputs.ticket }}
  deploy-production:
    needs: deploy-staging
    environment: prod
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: prod
      namespace: production
      values-file: values-prod.yaml
      argo-app: git-node-app-production
      argo-url: ${{ vars.ARGOCD_URL }}
      app-url: ${{ vars.PROD_APP_URL }}
      ticket: ${{ inputs.ticket }}
  manual-approval:
    needs:
      - deploy-production
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Review all CI tests and staging deployment before approving
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: Admins (System),763b83e4-b6af-11f1-bc4e-42010a83ae0f
