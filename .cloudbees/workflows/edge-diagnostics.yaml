apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: edge-diagnostics

# Isolates why release jobs can't be placed on the Edge runner
# (EdgeJobCreationFailed: 406). Round 1 (structure) all passed; round 2 adds
# one ingredient of the release's deploy job per Edge job. All jobs are
# independent; none of them touch the cluster or Git.

on:
  workflow_dispatch:

jobs:
  edge-plain:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Edge runner
        uses: docker://alpine:3.20
        run: echo "edge runner OK"

  edge-checkout:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Check out release repo
        uses: cloudbees-io/checkout@v1
      - name: List workspace
        uses: docker://alpine:3.20
        run: ls "$CLOUDBEES_WORKSPACE"

  edge-secret-kubeconfig:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Secret KUBECONFIG_DEPLOYER in env
        uses: docker://alpine:3.20
        env:
          KCFG: ${{ secrets.KUBECONFIG_DEPLOYER }}
        run: echo "KUBECONFIG_DEPLOYER length ${#KCFG}"

  edge-secret-token:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Secret RELEASE_REPO_TOKEN in env
        uses: docker://alpine:3.20
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: echo "RELEASE_REPO_TOKEN length ${#GH_TOKEN}"

  edge-script:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Release-style script and manifest JSON
        uses: docker://alpine/k8s:1.36.5
        env:
          MANIFEST: '{"git-node-app-test2":{"deploy":true,"docker.io/antonychiu2/git-node-app-test2":{"deploy":true,"version":"sha-test","url":"docker.io/antonychiu2/git-node-app-test2:sha-test","id":"test"}}}'
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          jq -e '."git-node-app-test2" | to_entries | map(select((.value | type) == "object" and .value.deploy == true)) | .[0].value' /tmp/manifest.json
          printf '%s' "dummy" > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          remote="https://x-access-token:dummy@github.com/antonychiu2/git-node-app-release.git"
          echo "script OK"

  edge-evidence:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Publish evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: "edge evidence OK"
