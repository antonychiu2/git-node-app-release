apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

# Reusable GitOps deploy workflow, called once per environment by release.yaml.
#
#   1. Read the git-node-app-test2 image from the release manifest.
#   2. Commit that image tag to git-node-app/<values-file> on main (Git is the
#      source of truth; Argo CD watches this repo).
#   3. Poll the Argo CD API until the Application reports that exact commit
#      Synced + Healthy, so the stage only passes once the new pods are serving.
#   4. Register the deployed artifact against the environment in Unify.
#
# Runs on CloudBees cloud runners. Argo CD is reached through an ngrok tunnel
# (argo-url) with a read-only Argo CD account token; the pipeline never holds
# cluster credentials. (Edge runner jobs can't be created for runs launched from
# a Unify Release — see GS-6.)
#
# Manifest shape (generated by Unify):
#   { "<component>": { "deploy": true, "<artifact>": { "deploy": true, "version": ..., "url": ..., "id": ... } } }
#
# Secrets:
#   RELEASE_REPO_TOKEN  GitHub token with contents:write on this repo, to push the tag change.
#   ARGOCD_TOKEN        API token of the Argo CD "unify" account (get on the git-node-app Applications only).

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
      environment:
        type: string
        required: true
      namespace:
        type: string
        required: true
      values-file:
        type: string
        required: true
      argo-app:
        type: string
        required: true
      argo-url:
        type: string
        required: true
      app-url:
        type: string
        required: false
        default: ""
      ticket:
        type: string
        required: false
        default: ""

env:
  COMPONENT: git-node-app-test2
  APP_REPO: antonychiu2/git-node-app-test2
  RELEASE_REPO: antonychiu2/git-node-app-release
  REPO_URL: github.com/antonychiu2/git-node-app-release.git
  JIRA_BROWSE_URL: https://antony-chiu.atlassian.net/browse

jobs:
  deploy:
    steps:
      - name: Check out release repo
        uses: cloudbees-io/checkout@v1

      - id: artifact
        name: Read artifact from release manifest
        uses: docker://alpine/k8s:1.36.5
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          # First artifact of this component marked for deployment.
          jq -e --arg c "$COMPONENT" '
            .[$c] | to_entries
            | map(select((.value | type) == "object" and .value.deploy == true))
            | .[0].value' /tmp/manifest.json > /tmp/artifact.json \
            || { echo "No $COMPONENT artifact marked for deployment in the manifest"; cat /tmp/manifest.json; exit 1; }
          cat /tmp/artifact.json

          url=$(jq -r '.url' /tmp/artifact.json)
          printf '%s' "${url%:*}"                 > "$CLOUDBEES_OUTPUTS/repository"
          printf '%s' "${url##*:}"                > "$CLOUDBEES_OUTPUTS/tag"
          printf '%s' "$(jq -r '.id' /tmp/artifact.json)"      > "$CLOUDBEES_OUTPUTS/id"
          printf '%s' "$(jq -r '.version' /tmp/artifact.json)" > "$CLOUDBEES_OUTPUTS/version"

          # Source commit the image was built from (CI tags images sha-<commit>).
          tag="${url##*:}"; src=""; msg=""
          case "$tag" in sha-*) src="${tag#sha-}" ;; esac
          if [ -n "$src" ]; then
            msg=$(curl -fsS --max-time 10 "https://api.github.com/repos/$APP_REPO/commits/$src" \
                  | jq -r '.commit.message | split("\n")[0]' | tr -d '|`') || msg=""
          fi
          printf '%s' "$src" > "$CLOUDBEES_OUTPUTS/source-commit"
          printf '%s' "$msg" > "$CLOUDBEES_OUTPUTS/source-message"

      - id: provenance
        name: Resolve image digest
        uses: docker://gcr.io/go-containerregistry/crane:debug
        run: |
          # The digest pins the exact bytes deployed; tags can move, digests can't.
          img="${{ steps.artifact.outputs.repository }}:${{ steps.artifact.outputs.tag }}"
          crane digest "$img" > "$CLOUDBEES_OUTPUTS/digest" || printf 'unavailable' > "$CLOUDBEES_OUTPUTS/digest"
          echo "$img@$(cat "$CLOUDBEES_OUTPUTS/digest")"

      - id: gitops
        name: Commit image tag to Git
        uses: docker://alpine:3.20
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          IMAGE_REPO: ${{ steps.artifact.outputs.repository }}
          IMAGE_TAG: ${{ steps.artifact.outputs.tag }}
          VALUES_FILE: git-node-app/${{ inputs.values-file }}
          TARGET_ENV: ${{ inputs.environment }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -eu
          apk add --no-cache git yq-go >/dev/null
          cd "$CLOUDBEES_WORKSPACE"
          git config --global --add safe.directory "$CLOUDBEES_WORKSPACE"
          git config user.name  "CloudBees Unify release"
          git config user.email "unify-release@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@${REPO_URL}"

          # Retry in case main moved (e.g. the staging commit, or a human push).
          pushed=false
          for attempt in 1 2 3; do
            git fetch -q "$remote" main
            git reset -q --hard FETCH_HEAD
            base=$(git rev-parse HEAD)
            prev=$(yq '.image.tag // ""' "$VALUES_FILE")
            yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
            if git diff --quiet; then
              echo "$VALUES_FILE already pins $IMAGE_REPO:$IMAGE_TAG; nothing to commit"
              pushed=true; break
            fi
            git commit -q -am "${TICKET:+$TICKET }Deploy $COMPONENT $IMAGE_TAG to $TARGET_ENV"
            if git push -q "$remote" HEAD:main; then pushed=true; break; fi
            echo "Push attempt $attempt rejected; retrying"; sleep 3
          done
          [ "$pushed" = true ] || { echo "Could not push the tag change to main"; exit 1; }

          rev=$(git rev-parse HEAD)
          git log -1 --format='%h %s'
          printf '%s' "$rev"  > "$CLOUDBEES_OUTPUTS/revision"
          printf '%s' "$base" > "$CLOUDBEES_OUTPUTS/base-revision"
          printf '%s' "$prev" > "$CLOUDBEES_OUTPUTS/previous-tag"

      - id: argo
        name: Wait for Argo CD sync and health
        uses: docker://alpine/k8s:1.36.5
        kind: deploy
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          ARGO_URL: ${{ inputs.argo-url }}
          APP: ${{ inputs.argo-app }}
          WANT: ${{ steps.gitops.outputs.revision }}
        run: |
          set -eu
          api="${ARGO_URL%/}/api/v1/applications/$APP"
          argo() {
            curl -sS --fail-with-body --max-time 20 \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "ngrok-skip-browser-warning: true" "$@"
          }

          echo "Waiting for $APP to sync $WANT and become Healthy"
          for i in $(seq 1 72); do   # ~6 minutes
            # Every ~30s ask Argo CD to re-read Git now instead of on its 3-minute poll.
            q=""; [ $((i % 6)) -eq 1 ] && q="?refresh=normal"
            if ! argo "$api$q" > /tmp/app.json; then
              echo "[$i] Argo CD API call failed; retrying"; sleep 5; continue
            fi
            rev=$(jq -r '.status.sync.revision // ""' /tmp/app.json)
            sync=$(jq -r '.status.sync.status // ""' /tmp/app.json)
            health=$(jq -r '.status.health.status // ""' /tmp/app.json)
            phase=$(jq -r '.status.operationState.phase // "none"' /tmp/app.json)
            echo "[$i] revision=$rev sync=$sync health=$health operation=$phase"

            if [ "$rev" = "$WANT" ]; then
              if [ "$sync" = Synced ] && [ "$health" = Healthy ]; then
                printf '%s' "$health" > "$CLOUDBEES_OUTPUTS/health"
                jq -j '.status.summary.images // [] | join(", ")'   /tmp/app.json > "$CLOUDBEES_OUTPUTS/images"
                jq -j '.status.operationState.startedAt // ""'      /tmp/app.json > "$CLOUDBEES_OUTPUTS/sync-started"
                jq -j '.status.operationState.finishedAt // ""'     /tmp/app.json > "$CLOUDBEES_OUTPUTS/sync-finished"
                jq -j '.status.operationState.operation.initiatedBy | if .automated then "Argo CD automated sync" else (.username // "unknown") end' \
                  /tmp/app.json > "$CLOUDBEES_OUTPUTS/sync-initiator" || printf 'unknown' > "$CLOUDBEES_OUTPUTS/sync-initiator"
                echo "Images: $(cat "$CLOUDBEES_OUTPUTS/images")"
                exit 0
              fi
              case "$phase" in Failed|Error)
                echo "Argo CD sync failed: $(jq -r '.status.operationState.message' /tmp/app.json)"; break ;;
              esac
              [ "$health" = Degraded ] && { echo "Rollout is Degraded"; break; }
            fi
            sleep 5
          done

          echo "Argo CD did not report $WANT Synced + Healthy"
          jq -r '.status.resources[]? | select(.health.status? and .health.status != "Healthy")
                 | "  \(.kind)/\(.name): \(.health.status) \(.health.message // "")"' /tmp/app.json || true
          jq -r '.status.conditions[]? | "  condition \(.type): \(.message)"' /tmp/app.json || true
          exit 1

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ steps.artifact.outputs.id }}
          target-environment: ${{ inputs.environment }}

      # Evidence for reviewers/auditors: what changed, which exact artifact, proof it
      # is running healthy (from Argo CD, not assumed), where to look, how to undo.
      # Who triggered/approved the release is recorded by Unify itself.
      - id: evidence
        name: Compose deployment evidence
        uses: docker://alpine/k8s:1.36.5
        env:
          ENV_NAME: ${{ inputs.environment }}
          NS: ${{ inputs.namespace }}
          VALUES_FILE: git-node-app/${{ inputs.values-file }}
          APP_URL: ${{ inputs.app-url }}
          ARGO_URL: ${{ inputs.argo-url }}
          ARGO_APP: ${{ inputs.argo-app }}
          TICKET: ${{ inputs.ticket }}
          IMAGE_REPO: ${{ steps.artifact.outputs.repository }}
          IMAGE_TAG: ${{ steps.artifact.outputs.tag }}
          ART_VERSION: ${{ steps.artifact.outputs.version }}
          ART_ID: ${{ steps.artifact.outputs.id }}
          SRC_COMMIT: ${{ steps.artifact.outputs.source-commit }}
          SRC_MSG: ${{ steps.artifact.outputs.source-message }}
          DIGEST: ${{ steps.provenance.outputs.digest }}
          REV: ${{ steps.gitops.outputs.revision }}
          BASE_REV: ${{ steps.gitops.outputs.base-revision }}
          PREV_TAG: ${{ steps.gitops.outputs.previous-tag }}
          HEALTH: ${{ steps.argo.outputs.health }}
          IMAGES: ${{ steps.argo.outputs.images }}
          SYNC_STARTED: ${{ steps.argo.outputs.sync-started }}
          SYNC_FINISHED: ${{ steps.argo.outputs.sync-finished }}
          SYNC_BY: ${{ steps.argo.outputs.sync-initiator }}
        run: |
          set -eu
          gh="https://github.com"
          s() { printf '%s' "$1" | cut -c1-12; }
          {
            printf '## ✅ Deployed to **%s**: `%s` `%s`\n\n' "$ENV_NAME" "$COMPONENT" "$(s "$IMAGE_TAG")"
            printf 'Argo CD reported Git revision `%s` **Synced / %s** before this stage passed.\n\n' "$(s "$REV")" "$HEALTH"

            printf '### Change\n| | |\n|---|---|\n'
            if [ -n "$TICKET" ]; then printf '| Ticket | [%s](%s/%s) |\n' "$TICKET" "$JIRA_BROWSE_URL" "$TICKET"; fi
            if [ "$PREV_TAG" = "$IMAGE_TAG" ]; then
              printf '| Version | `%s` (unchanged, already deployed) |\n' "$IMAGE_TAG"
            else
              printf '| Version | `%s` → **`%s`** |\n' "${PREV_TAG:-none}" "$IMAGE_TAG"
            fi
            if [ "$REV" = "$BASE_REV" ]; then
              printf '| GitOps commit | none needed: `%s` already pinned this image at [`%s`](%s/%s/commit/%s) |\n' "$VALUES_FILE" "$(s "$REV")" "$gh" "$RELEASE_REPO" "$REV"
            else
              printf '| GitOps commit | [`%s`](%s/%s/commit/%s) (`%s`, [diff](%s/%s/compare/%s...%s)) |\n' \
                "$(s "$REV")" "$gh" "$RELEASE_REPO" "$REV" "$VALUES_FILE" "$gh" "$RELEASE_REPO" "$BASE_REV" "$REV"
            fi

            printf '\n### Build provenance\n| | |\n|---|---|\n'
            if [ -n "$SRC_COMMIT" ]; then
              printf '| Source commit | [`%s`](%s/%s/commit/%s) %s |\n' "$(s "$SRC_COMMIT")" "$gh" "$APP_REPO" "$SRC_COMMIT" "$SRC_MSG"
            fi
            printf '| Image | `%s:%s` |\n' "$IMAGE_REPO" "$IMAGE_TAG"
            printf '| Digest | `%s` |\n' "$DIGEST"
            printf '| Unify artifact | version `%s`, id `%s` (tests and scans are on its CI run) |\n' "$ART_VERSION" "$ART_ID"

            printf '\n### Deployment verification (reported by Argo CD)\n| | |\n|---|---|\n'
            printf '| Argo CD application | [%s](%s/applications/argocd/%s): **Synced / %s** at `%s` |\n' "$ARGO_APP" "${ARGO_URL%/}" "$ARGO_APP" "$HEALTH" "$(s "$REV")"
            printf '| Running images | `%s` |\n' "$IMAGES"
            printf '| Sync | started `%s`, finished `%s`, by %s |\n' "${SYNC_STARTED:-n/a}" "${SYNC_FINISHED:-n/a}" "$SYNC_BY"

            printf '\n### Access\n| | |\n|---|---|\n'
            if [ -n "$APP_URL" ]; then printf '| Application | %s |\n' "$APP_URL"; fi
            printf '| Namespace | `%s` |\n' "$NS"

            printf '\n### Rollback\n'
            if [ "$REV" != "$BASE_REV" ] && [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
              printf 'Revert [`%s`](%s/%s/commit/%s) on `%s` (`git revert %s`); Argo CD then restores `%s` automatically.\n' \
                "$(s "$REV")" "$gh" "$RELEASE_REPO" "$REV" "$RELEASE_REPO" "$(s "$REV")" "$PREV_TAG"
            else
              printf 'Set `image.tag` in `%s` back to the previous version and commit; Argo CD applies it automatically.\n' "$VALUES_FILE"
            fi
          } > "$CLOUDBEES_OUTPUTS/summary"
          cat "$CLOUDBEES_OUTPUTS/summary"

      - name: Publish deployment evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.evidence.outputs.summary }}
