apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

# Reusable GitOps deploy workflow, called once per environment by release.yaml.
#
#   1. Read the git-node-app-test2 image from the release manifest.
#   2. Commit that image tag to git-node-app/<values-file> on main (Git is the
#      source of truth; Argo CD watches this repo).
#   3. Wait until Argo CD reports that exact commit Synced + Healthy, so the
#      stage only passes once the new pods are really serving.
#   4. Register the deployed artifact against the environment in Unify.
#
# Runs on the Edge runner on antony-ubuntu-vm, because Argo CD is only
# reachable from inside that network.
#
# Manifest shape (generated by Unify):
#   { "<component>": { "deploy": true, "<artifact>": { "deploy": true, "version": ..., "url": ..., "id": ... } } }
#
# Secrets:
#   RELEASE_REPO_TOKEN   GitHub token with contents:write on this repo, to push the tag change.
#   KUBECONFIG_DEPLOYER  kubeconfig for the unify-deployer ServiceAccount: read/refresh
#                        Argo CD Applications in the argocd namespace, view in the target namespace.

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
      environment:
        type: string
        required: true
      namespace:
        type: string
        required: true
      values-file:
        type: string
        required: true
      argo-app:
        type: string
        required: true
      ticket:
        type: string
        required: false
        default: ""

env:
  COMPONENT: git-node-app-test2
  REPO_URL: github.com/antonychiu2/git-node-app-release.git

jobs:
  deploy:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Check out release repo
        uses: cloudbees-io/checkout@v1

      - id: artifact
        name: Read artifact from release manifest
        uses: docker://alpine/k8s:1.36.5
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          # First artifact of this component marked for deployment.
          jq -e --arg c "$COMPONENT" '
            .[$c] | to_entries
            | map(select((.value | type) == "object" and .value.deploy == true))
            | .[0].value' /tmp/manifest.json > /tmp/artifact.json \
            || { echo "No $COMPONENT artifact marked for deployment in the manifest"; cat /tmp/manifest.json; exit 1; }
          cat /tmp/artifact.json

          url=$(jq -r '.url' /tmp/artifact.json)
          printf '%s' "${url%:*}"                 > "$CLOUDBEES_OUTPUTS/repository"
          printf '%s' "${url##*:}"                > "$CLOUDBEES_OUTPUTS/tag"
          printf '%s' "$(jq -r '.id' /tmp/artifact.json)"      > "$CLOUDBEES_OUTPUTS/id"
          printf '%s' "$(jq -r '.version' /tmp/artifact.json)" > "$CLOUDBEES_OUTPUTS/version"

      - id: gitops
        name: Commit image tag to Git
        uses: docker://alpine:3.20
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          IMAGE_REPO: ${{ steps.artifact.outputs.repository }}
          IMAGE_TAG: ${{ steps.artifact.outputs.tag }}
          VALUES_FILE: git-node-app/${{ inputs.values-file }}
          TARGET_ENV: ${{ inputs.environment }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -eu
          apk add --no-cache git yq-go >/dev/null
          cd "$CLOUDBEES_WORKSPACE"
          git config --global --add safe.directory "$CLOUDBEES_WORKSPACE"
          git config user.name  "CloudBees Unify release"
          git config user.email "unify-release@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@${REPO_URL}"

          # Retry in case main moved (e.g. the staging commit, or a human push).
          pushed=false
          for attempt in 1 2 3; do
            git fetch -q "$remote" main
            git reset -q --hard FETCH_HEAD
            yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
            if git diff --quiet; then
              echo "$VALUES_FILE already pins $IMAGE_REPO:$IMAGE_TAG; nothing to commit"
              pushed=true; break
            fi
            git commit -q -am "${TICKET:+$TICKET }Deploy $COMPONENT $IMAGE_TAG to $TARGET_ENV"
            if git push -q "$remote" HEAD:main; then pushed=true; break; fi
            echo "Push attempt $attempt rejected; retrying"; sleep 3
          done
          [ "$pushed" = true ] || { echo "Could not push the tag change to main"; exit 1; }

          rev=$(git rev-parse HEAD)
          git log -1 --format='%h %s'
          printf '%s' "$rev" > "$CLOUDBEES_OUTPUTS/revision"

      - id: argo
        name: Wait for Argo CD sync and health
        uses: docker://alpine/k8s:1.36.5
        kind: deploy
        env:
          KCFG: ${{ secrets.KUBECONFIG_DEPLOYER }}
          APP: ${{ inputs.argo-app }}
          NS: ${{ inputs.namespace }}
          WANT: ${{ steps.gitops.outputs.revision }}
        run: |
          set -eu
          printf '%s' "$KCFG" > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          # Ask Argo CD to re-read Git now instead of on its next 3-minute poll.
          kubectl -n argocd annotate application "$APP" argocd.argoproj.io/refresh=normal --overwrite >/dev/null

          status() { kubectl -n argocd get application "$APP" -o jsonpath="{$1}"; }
          echo "Waiting for $APP to sync $WANT and become Healthy"
          for i in $(seq 1 60); do   # ~5 minutes
            rev=$(status .status.sync.revision); sync=$(status .status.sync.status)
            health=$(status .status.health.status); phase=$(status .status.operationState.phase)
            echo "[$i] revision=$rev sync=$sync health=$health operation=${phase:-none}"
            if [ "$rev" = "$WANT" ]; then
              if [ "$sync" = Synced ] && [ "$health" = Healthy ]; then
                printf '%s' "$health" > "$CLOUDBEES_OUTPUTS/health"
                kubectl -n "$NS" get pods -l app=git-node-app -o wide
                exit 0
              fi
              case "$phase" in Failed|Error)
                echo "Argo CD sync failed: $(status .status.operationState.message)"; break ;;
              esac
              [ "$health" = Degraded ] && { echo "Rollout is Degraded"; break; }
            fi
            sleep 5
          done

          echo "Argo CD did not report $WANT Synced + Healthy"
          kubectl -n "$NS" get pods -l app=git-node-app -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -15 || true
          exit 1

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ steps.artifact.outputs.id }}
          target-environment: ${{ inputs.environment }}

      - name: Publish deployment evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Deployed to ${{ inputs.environment }} via Argo CD
            | | |
            |---|---|
            | Image | `${{ steps.artifact.outputs.repository }}:${{ steps.artifact.outputs.tag }}` |
            | Artifact version | `${{ steps.artifact.outputs.version }}` |
            | Git commit | [`${{ steps.gitops.outputs.revision }}`](https://github.com/antonychiu2/git-node-app-release/commit/${{ steps.gitops.outputs.revision }}) |
            | Argo CD application | `${{ inputs.argo-app }}` — Synced / ${{ steps.argo.outputs.health }} |
            | Namespace | `${{ inputs.namespace }}` |
