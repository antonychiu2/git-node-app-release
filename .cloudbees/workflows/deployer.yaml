apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

# Reusable deploy workflow, called once per environment by release.yaml.
# Runs on the Edge runner on antony-ubuntu-vm (the k3s host), reads the
# git-node-app-test2 image from the release manifest, deploys it with Helm,
# and registers the deployed artifact version against the environment.
#
# Manifest shape (generated by Unify):
#   { "<component>": { "<artifact>": { "deploy": true, "version": ..., "url": ..., "id": ... } } }
#
# Requires the secret KUBECONFIG_DEPLOYER: a kubeconfig for the
# unify-deployer ServiceAccount (admin in the staging/production namespaces only).

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
      environment:
        type: string
        required: true
      namespace:
        type: string
        required: true
      values-file:
        type: string
        required: true

env:
  COMPONENT: git-node-app-test2

jobs:
  deploy:
    runs-on: antony-ubuntu-vm
    steps:
      - name: Check out release repo
        uses: cloudbees-io/checkout@v1

      - id: artifact
        name: Read artifact from release manifest
        uses: docker://alpine/k8s:1.36.5
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          # First artifact of this component marked for deployment.
          jq -e --arg c "$COMPONENT" '
            .[$c] | to_entries
            | map(select((.value | type) == "object" and .value.deploy == true))
            | .[0].value' /tmp/manifest.json > /tmp/artifact.json \
            || { echo "No $COMPONENT artifact marked for deployment in the manifest"; exit 1; }
          cat /tmp/artifact.json

          url=$(jq -r '.url' /tmp/artifact.json)
          printf '%s' "${url%:*}"                 > "$CLOUDBEES_OUTPUTS/repository"
          printf '%s' "${url##*:}"                > "$CLOUDBEES_OUTPUTS/tag"
          printf '%s' "$(jq -r '.id' /tmp/artifact.json)"      > "$CLOUDBEES_OUTPUTS/id"
          printf '%s' "$(jq -r '.version' /tmp/artifact.json)" > "$CLOUDBEES_OUTPUTS/version"

      - name: Deploy with Helm
        uses: docker://alpine/k8s:1.36.5
        kind: deploy
        env:
          KCFG: ${{ secrets.KUBECONFIG_DEPLOYER }}
        run: |
          set -eu
          printf '%s' "$KCFG" > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          cd "$CLOUDBEES_WORKSPACE"

          helm upgrade --install git-node-app ./git-node-app \
            -n "${{ inputs.namespace }}" \
            -f "git-node-app/${{ inputs.values-file }}" \
            --set image.repository="${{ steps.artifact.outputs.repository }}" \
            --set image.tag="${{ steps.artifact.outputs.tag }}" \
            --wait --timeout 3m

          kubectl -n "${{ inputs.namespace }}" rollout status deployment/git-node-app --timeout=60s
          kubectl -n "${{ inputs.namespace }}" get pods -l app=git-node-app -o wide
          helm history git-node-app -n "${{ inputs.namespace }}" --max 5

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ steps.artifact.outputs.id }}
          target-environment: ${{ inputs.environment }}

      - name: Publish deployment evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Deployed to ${{ inputs.environment }}
            | | |
            |---|---|
            | Namespace | `${{ inputs.namespace }}` |
            | Image | `${{ steps.artifact.outputs.repository }}:${{ steps.artifact.outputs.tag }}` |
            | Artifact version | `${{ steps.artifact.outputs.version }}` |
            | Method | `helm upgrade --install --wait` via Edge runner `antony-ubuntu-vm` |
