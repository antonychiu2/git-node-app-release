apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: git-node-app-argo-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antonychiu2/git-node-app-release.git
    targetRevision: main
    path: git-node-app
    helm:
      releaseName: git-node-app
      valueFiles:
        - values-argo-demo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
